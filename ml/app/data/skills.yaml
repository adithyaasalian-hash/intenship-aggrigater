# Skill taxonomy.
#
# canonical_name: [alias, alias, ...]
#
# The canonical name is what gets stored on profiles and opportunities, so both
# sides of the match speak the same vocabulary. Aliases are what we look for in
# raw text. Matching is case-insensitive and word-boundary aware, so "R" will
# not fire on "React" and "go" will not fire on "going".
#
# This is the highest-leverage file in the ML service. Two hours spent adding
# skills here beats any amount of model tuning. Add the skills that appear in
# YOUR listings -- run `make skill-report` to see the most common unmatched
# capitalised tokens across ingested descriptions.

